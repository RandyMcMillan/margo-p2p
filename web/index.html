<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Margo Registry — IPFS</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 1rem; background: #1a1a2e; color: #e0e0e0; }
    h1 { color: #a78bfa; }
    #status { padding: 0.5rem; background: #2d2d44; border-radius: 4px; margin: 1rem 0; }
    #root-cid { font-family: monospace; word-break: break-all; color: #4ade80; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.25rem 0; cursor: pointer; }
    li:hover { color: #a78bfa; }
    #file-content { background: #2d2d44; padding: 1rem; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; max-height: 300px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Margo Registry — IPFS Node</h1>
  <div id="status">Starting...</div>
  <p>Root CID: <span id="root-cid">...</span></p>
  <h2>Files</h2>
  <div id="file-tree"></div>
  <h2>File Content</h2>
  <pre id="file-content"></pre>
  <script type="module" src="/main.js"></script>
</body>
</html>
