<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margo Crate Registry — IPFS</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 900px;
        margin: 0 auto;
        padding: 1rem;
        background: #1a1a2e;
        color: #e0e0e0;
        line-height: 1.5;
      }
      h1 {
        color: #a78bfa;
        margin: 0;
      }
      h2 {
        color: #a78bfa;
        margin-top: 1.5rem;
      }
      #status {
        padding: 0.5rem;
        background: #2d2d44;
        border-radius: 4px;
        margin: 1rem 0;
        font-size: 0.9rem;
      }
      #root-cid {
        font-family: monospace;
        word-break: break-all;
        color: #4ade80;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 0.25rem 0;
        cursor: pointer;
      }
      li:hover {
        color: #a78bfa;
      }
      #file-content {
        background: #2d2d44;
        padding: 1rem;
        border-radius: 4px;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 0.85rem;
        max-height: 300px;
        overflow: auto;
      }
      .crate-table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
      }
      .crate-table th,
      .crate-table td {
        padding: 0.5rem;
        text-align: left;
        border-bottom: 1px solid #444;
      }
      .crate-table th {
        color: #a78bfa;
      }
      .mg-copy {
        display: inline;
      }
      .mg-copy button {
        background: #2d2d44;
        color: #e0e0e0;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 0.25rem 0.5rem;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .mg-copy button:hover {
        background: #3d3d54;
      }
      pre {
        background: #2d2d44;
        padding: 0.5rem;
        border-radius: 4px;
        overflow-x: auto;
      }
      code {
        font-family: monospace;
        font-size: 0.85rem;
      }
      .hidden {
        display: none;
      }
      .invisible {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <h1>Margo Crate Registry — IPFS Node</h1>
    <div id="status">Starting Helia node...</div>
    <p>Root CID: <span id="root-cid">...</span></p>

    <h2>Available Crates</h2>
    <table class="crate-table" id="crate-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Versions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Files</h2>
    <ul id="file-tree"></ul>

    <h2>File Content</h2>
    <pre id="file-content"></pre>

    <h2>Fetch by CID</h2>
    <input
      id="cid-input"
      placeholder="Enter CID"
      style="
        width: 100%;
        padding: 0.5rem;
        background: #2d2d44;
        color: #e0e0e0;
        border: 1px solid #444;
        border-radius: 4px;
      "
    />
    <button
      id="fetch-btn"
      style="
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
        background: #a78bfa;
        color: #000;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      "
    >
      Fetch
    </button>
    <pre id="fetch-result"></pre>

    <script type="module" src="/main.js"></script>
  </body>
</html>
