name: "Build Margo Assets"
description: "Install toolchains and generate src/html/assets.rs via cargo xtask assets"
inputs:
  rust-toolchain:
    description: "Rust toolchain to use"
    required: false
    default: "nightly"
  rust-components:
    description: "Comma-separated rustup components to install"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup pnpm and Node
      uses: ./.github/actions/setup-pnpm

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}

    - name: Convert assets to Rust
      shell: bash
      run: cargo xtask assets
