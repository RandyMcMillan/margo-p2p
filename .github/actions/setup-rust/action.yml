name: "Setup Rust"
description: "Install a Rust toolchain"
inputs:
  toolchain:
    description: "Rust toolchain (e.g. stable, nightly, 1.90)"
    required: false
    default: "stable"
  components:
    description: "Comma-separated rustup components to install"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}