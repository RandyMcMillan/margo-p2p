name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build assets
        uses: ./.github/actions/build-assets
        with:
          rust-toolchain: "1.90"

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.26"

      - name: Build margo
        run: cargo build --features ipfs

      - name: Initialize registry
        run: |
          MARGO=./target/debug/margo
          mkdir -p registry
          $MARGO init --defaults --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" --html true registry

      - name: Generate HTML index
        run: |
          MARGO=./target/debug/margo
          $MARGO generate-html --registry registry

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web app (browser IPFS node)
        working-directory: web
        env:
          REPO_ROOT: ${{ github.workspace }}/registry
        run: |
          npm ci
          npm run build -- --outDir "${{ github.workspace }}/dist" --emptyOutDir

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
