name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout kubo (for FFI)
        uses: actions/checkout@v4
        with:
          repository: RandyMcMillan/kubo
          ref: v0.43.1-ffi.4
          path: kubo

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90'

      - name: Install pnpm and node
        uses: pnpm/setup@v2
        with:
          version: ^11
          runtime: node@26
          cache: true

      - name: Build UI assets
        run: pnpm build

      - name: Build margo
        run: cargo build --features ipfs

      - name: Initialize registry
        run: |
          MARGO=./target/debug/margo
          mkdir -p registry
          $MARGO init --defaults --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" --html true registry

      - name: Generate HTML index
        run: |
          MARGO=./target/debug/margo
          $MARGO generate-html --registry registry

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web app (browser IPFS node)
        working-directory: web
        env:
          REPO_ROOT: ${{ github.workspace }}/registry
        run: |
          npm ci
          npm run build -- --outDir "${{ github.workspace }}/dist" --emptyOutDir

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4